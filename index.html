/** @returns {HabitInput} */
function emptyHabitInput(){return {name:'',category:'',days:[],time:'19:30',notificationEnabled:true,notificationIntensity:'light'};}
/** @param {HabitInput} input @returns {Record<string,string>} */
function validateHabit(input){
 /** @type {Record<string,string>} */
 const errors={};
 if(!input.name.trim())errors.name='시작할 루틴의 이름을 입력해주세요.';
 else if(input.name.trim().length>40)errors.name='루틴 이름은 40자 이내로 적어주세요.';
 if(!habitCategories.includes(input.category))errors.category='루틴의 카테고리를 하나 선택해주세요.';
 if(!input.days.length||input.days.some(d=>!Number.isInteger(d)||d<0||d>6))errors.days='실천할 요일을 하나 이상 선택해주세요.';
 if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(input.time))errors.time='실천 시간을 올바르게 설정해주세요.';
 if(input.notificationEnabled&&!intensityOptions.some(i=>i.id===input.notificationIntensity))errors.notificationIntensity='알림 강도를 선택해주세요.';
 return errors;
}
/** @param {string} prefix */
function uniqueId(prefix){return prefix+'_'+crypto.randomUUID();}
/** Pure domain operation: persistence is a separate, atomic repository commit.
 * @param {HabitInput} input @param {string} creationToken
 * @param {()=>string} [now] @param {()=>number} [random]
 * @returns {{habit:Habit,plant:Plant}}
 */
function createHabitPair(input,creationToken,now=()=>new Date().toISOString(),random=Math.random){
 const errors=validateHabit(input);if(Object.keys(errors).length)throw new Error(Object.values(errors)[0]);
 const createdAt=now();const habitId=uniqueId('habit');
 return {habit:{id:habitId,name:input.name.trim(),category:input.category,days:[...new Set(input.days)].sort(),time:input.time,notificationEnabled:input.notificationEnabled,notificationIntensity:input.notificationIntensity,createdAt,status:'active',completionCount:0,creationToken},plant:{id:uniqueId('plant'),habitId,stage:'seed',waterDrops:0,completionCount:0,createdAt,completedAt:null,plantType:plantTypes[Math.floor(random()*plantTypes.length)]||plantTypes[0]}};
}
/** @param {Habit[]} habits @param {Date} [date] */
function todayHabits(habits,date=new Date()){
 const today=new Intl.DateTimeFormat('en-US',{weekday:'short',timeZone:'Asia/Seoul'}).format(date);
 const day=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(today);
 return habits.filter(h=>h.status==='active'&&h.days.includes(day)).sort((a,b)=>a.time.localeCompare(b.time));
}
/** @param {number[]} days */
function daysLabel(days){return days.length===7?'매일':days.map(d=>weekDays[d]).join(' · ');}

function gardenDate(iso){return new Date(iso).toLocaleDateString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'});}

/** @typedef {import('../src/models').AppState} AppState */
/** @typedef {import('../src/models').HabitInput} HabitInput */
const KEY='haroot-foundation-v1';
let readBlocked=false;
let storageMessage='';
/** @returns {AppState} */
const initial=()=>({profile:null,guest:false,savedActivities:[],savedPolicies:[],habits:[],plants:[],objects:[],notifications:true,privatePhotos:true});
/** @returns {AppState} */
function load(){
 try{
  const raw=localStorage.getItem(KEY);if(!raw){readBlocked=false;storageMessage='';return initial();}
  const x=JSON.parse(raw);
  if(!x||typeof x!=='object'||Array.isArray(x))throw new Error('invalid data');
  for(const k of ['savedActivities','savedPolicies','habits','plants','objects'])if(x[k]!==undefined&&!Array.isArray(x[k]))throw new Error('invalid list');
  /** @type {AppState} */
  const value={...initial(),...x};
  if(value.profile&&(typeof value.profile.nickname!=='string'||!Array.isArray(value.profile.interests)))throw new Error('invalid profile');
  for(const h of value.habits){if(!h||typeof h.id!=='string'||typeof h.name!=='string'||!Array.isArray(h.days)||Object.keys(validateHabit(h)).length||!['active','completed','paused'].includes(h.status)||!Number.isFinite(Date.parse(h.createdAt)))throw new Error('invalid habit');}
  const habitIds=new Set(value.habits.map(h=>h.id));
  if(habitIds.size!==value.habits.length)throw new Error('duplicate habit');
  for(const p of value.plants){if(!p||typeof p.id!=='string'||!habitIds.has(p.habitId)||!['seed','sprout','leaf','branch','bud','complete'].includes(p.stage)||!Number.isFinite(p.waterDrops)||p.waterDrops<0||!plantTypes.includes(p.plantType)||!Number.isFinite(Date.parse(p.createdAt)))throw new Error('invalid plant');}
  if(new Set(value.plants.map(p=>p.id)).size!==value.plants.length||new Set(value.plants.map(p=>p.habitId)).size!==value.plants.length||value.plants.length!==value.habits.length)throw new Error('invalid pair');
  readBlocked=false;storageMessage='';return value;
 }catch{
  readBlocked=true;storageMessage='저장된 정보를 읽지 못했어요. 기존 데이터는 지우지 않았어요. 다시 불러오거나 개인정보 메뉴에서 체험 데이터를 초기화할 수 있어요.';
  return initial();
 }
}
/** @param {AppState} value */
function persist(value){
 if(readBlocked){storageMessage='기존 데이터를 읽지 못해 덮어쓰기를 중단했어요. 먼저 다시 불러와주세요.';return false;}
 try{localStorage.setItem(KEY,JSON.stringify(value));storageMessage='';return true;}catch{storageMessage='저장하지 못했어요. 브라우저 저장공간과 설정을 확인한 뒤 다시 시도해주세요.';return false;}
}
/** The ONLY create operation: serialize both entities in one setItem before exposing state.
 * @param {AppState} current @param {HabitInput} input @param {string} creationToken
 */
function saveHabitWithSeed(current,input,creationToken){
 const existing=current.habits.find(h=>h.creationToken===creationToken);
 if(existing){const plant=current.plants.find(p=>p.habitId===existing.id);if(!plant)throw new Error('연결된 씨앗을 찾지 못했어요. 다시 불러와주세요.');return {state:current,habit:existing,plant};}
 const pair=createHabitPair(input,creationToken);
 const next={...current,habits:[...current.habits,pair.habit],plants:[...current.plants,pair.plant]};
 if(!persist(next))throw new Error(storageMessage);

function avatar(p){return p.image?`<img class="avatar" src="${esc(p.image)}" alt="내 프로필 이미지">`:`<div class="avatar">${avatars[p.avatar]||avatars[0]}</div>`;}
function modal(title,body){window.modalFocus=document.activeElement;overlay.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="닫기">${icon('close')}</button></div>${body}</section></div>`;document.body.style.overflow='hidden';overlay.querySelector('button')?.focus();}
function close(){overlay.innerHTML='';document.body.style.overflow='';window.modalFocus?.focus();}
function isRoute(target){return navs.some(([id])=>id===target)||['garden/start','garden/recommend','garden/recommend/check','garden/create-habit'].includes(target)||/^garden\/(plant|seed-received)\/[a-zA-Z0-9_-]+$/.test(target);}
function syncHabitDraft(){const form=document.querySelector('#habit-form');if(!form)return;const data=new FormData(form);habitDraft={name:String(data.get('name')||''),category:String(data.get('category')||''),days:data.getAll('days').map(Number),time:String(data.get('time')||''),notificationEnabled:data.get('notificationEnabled')==='on',notificationIntensity:String(data.get('notificationIntensity')||habitDraft.notificationIntensity)};}
function navigate(target,replace=false){
 if(!isRoute(target))target='home';
 if(route==='garden/create-habit')syncHabitDraft();
 if(target==='garden'||!target.startsWith('garden/')){habitDraft=emptyHabitInput();habitErrors={};habitToken='';}
 route=target;close();history[replace?'replaceState':'pushState'](null,'','#'+target);render();window.scrollTo(0,0);

}
function shell(body){return `<aside class="sidebar">${brand()}<nav class="nav" aria-label="주요 메뉴">${navs.map(([id,label])=>`<button data-action="nav:${id}" class="${(route===id||(id==='garden'&&route.startsWith('garden/')))?'active':''}" ${(route===id||(id==='garden'&&route.startsWith('garden/')))?'aria-current="page"':''}>${icon(id)}<span>${label}</span></button>`).join('')}</nav><div class="sidebar-foot"><span class="demo-tag">FIRST EDITION · MVP</span><div class="side-leaf">${icon('leaf',25)}<p>하루의 작은 시작이<br>나의 생활에 뿌리내리도록.</p><p style="margin-top:20px;font-size:10px">MADE FOR LIFE IN BUSAN</p></div></div></aside><div class="app-shell"><header class="topbar">${brand()}<div class="location">${icon('pin',16)} 부산 ${esc(state.profile?.district||'전체 지역')} <span style="margin-left:7px;color:#9aa58e">⌄</span></div><div class="top-actions"><span class="demo-tag">PROTOTYPE</span><button class="icon-btn" data-action="notifications" aria-label="알림">${icon('bell')}</button><button class="icon-btn" data-action="messages" aria-label="메시지">${icon('message')}</button></div></header><main class="content" id="main">${storageMessage?`<div class="storage-warning" role="alert">${esc(storageMessage)}<button class="text-btn" data-action="retryStorage">다시 불러오기</button></div>`:''}${body}</main></div>`;}
function activityCard(a){return `<article class="activity-card" tabindex="0" role="button" aria-label="${esc(a.title)} 상세" data-action="activity:${a.id}"><div class="card-art">${art(a.art)}<button class="save ${state.savedActivities.includes(a.id)?'saved':''}" data-action="saveActivity:${a.id}" aria-label="${esc(a.title)} 저장" aria-pressed="${state.savedActivities.includes(a.id)}">${icon('save',17)}</button></div><div class="card-body"><span class="badge">${a.kind==='public'?'기관 프로그램':'함께하는 모임'} · ${a.category}</span><h3>${a.title}</h3><div class="card-meta">${icon('pin',12)}${a.district}<span>·</span>${a.date}</div><div class="tag-row"><span class="soft-tag">혼자 참여하기 편함</span><span class="soft-tag">${a.capacity}명 소규모</span></div></div></article>`;}
function policyCard(p){return `<article class="benefit" tabindex="0" role="button" data-action="policy:${p.id}" aria-label="${p.name} 상세"><div class="policy-symbol">${icon(p.category==='주거'?'home':'benefits',25)}</div><div><span class="badge">${p.category}</span> <span class="badge orange">${p.deadline}</span><h3>${p.name}</h3><small style="font-size:11px">${p.title}</small></div><button class="save ${state.savedPolicies.includes(p.id)?'saved':''}" aria-label="${p.name} 저장" aria-pressed="${state.savedPolicies.includes(p.id)}" data-action="savePolicy:${p.id}">${icon('save',16)}</button></article>`;}
function home(){const name=state.profile?.nickname||'새로운 이웃';return `<div class="heading"><div><p class="eyebrow" style="margin:0 0 6px">YOUR EVERYDAY, ROOTED HERE</p><h1>안녕, ${esc(name)} <span style="font-size:24px">☀</span></h1><p>부산에서 보내는 오늘, 어떤 하루를 가꿔볼까요?</p></div><div class="date">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long',timeZone:'Asia/Seoul'})}</div></div><section class="hero"><div class="hero-copy"><span class="eyebrow">A LITTLE STEP, A NEW ROUTE</span><h2>익숙한 하루에,<br>새로운 부산 한 조각.</h2><p>가볍게 나가고, 좋아하는 것을 만나고.<br>나의 속도로 시작하는 부산생활.</p>${button(`이번 주 활동 둘러보기 ${icon('arrow',16)}`,'nav:discover')}</div><div class="hero-art">${art('garden')}</div></section><section class="section"><div class="section-title"><div><h2>놓치면 아쉬운 혜택</h2><p>혼자 사는 일상에 든든한 도움이 되도록</p></div><button class="text-btn" data-action="nav:benefits">전체 보기 ${icon('arrow',15)}</button></div><div class="benefit-grid">${policies.slice(0,2).map(policyCard).join('')}</div></section><section class="section"><div class="section-title"><div><h2>이번 주, 함께하면 좋은 일</h2><p>${state.profile?.interests.length?esc(state.profile.interests.slice(0,3).join(' · '))+'에 관심 있는 당신에게':'처음이어도, 혼자여도 편안하게'}</p></div><button class="text-btn" data-action="nav:discover">더 보기 ${icon('arrow',15)}</button></div><div class="card-grid home-activities">${[...activities].sort((a,b)=>Number(state.profile?.interests.includes(b.category)||false)-Number(state.profile?.interests.includes(a.category)||false)).slice(0,3).map(activityCard).join('')}</div></section>${homeRoutines(state)}<p class="note">체험용 시제품입니다. 정책·활동·마감일은 모두 예시이며, 실제 모집이나 지원 정보가 아닙니다.</p>`;}
function garden(){return gardenPage(state);}
function discover(){return `<div class="heading"><div><p class="eyebrow">FIND YOUR NEXT ROUTE</p><h1>발견</h1><p>좋아하는 것을 따라, 부산과 가까워져요.</p></div>${button(`${icon('plus',16)} 모임 만들기`,'createMeeting','outline')}</div><div class="toolbar"><label class="search">${icon('search',19)}<input id="activity-search" aria-label="활동 검색" placeholder="관심 있는 활동, 동네를 검색해보세요" value="${esc(filters.query)}"></label><select id="district-filter" aria-label="활동 지역" class="btn outline"><option value="전체">모든 지역</option>${districts.map(d=>`<option ${filters.district===d?'selected':''}>${d}</option>`).join('')}</select></div><div class="chips" aria-label="활동 분야">${['전체',...interests].map(c=>`<button class="chip ${filters.category===c?'selected':''}" data-action="category:${c}" aria-pressed="${filters.category===c}">${c}</button>`).join('')}</div><div id="activity-results">${activityResults()}</div><p class="note">기관 프로그램과 사용자 모임의 예시입니다. 현재 실제 참가 신청은 진행되지 않아요.</p>`;}
function activityResults(){const list=activities.filter(a=>(filters.category==='전체'||a.category===filters.category)&&(filters.district==='전체'||a.district===filters.district)&&(`${a.title}${a.district}${a.category}`.includes(filters.query.trim())));return `<p class="count">함께할 수 있는 활동 <strong>${list.length}</strong>개 · 예시 데이터</p><div class="card-grid">${list.map(activityCard).join('')}</div>${!list.length?'<div class="empty">아직 맞는 활동이 없어요.<br>다른 지역이나 관심사로 찾아볼까요?<br><button class="text-btn" data-action="clearFilters">필터 초기화</button></div>':''}`;}
function benefits(){const list=policies.filter(p=>benefitFilter==='전체'||p.category===benefitFilter);return `<div class="heading"><div><p class="eyebrow">SUPPORT FOR YOUR EVERYDAY</p><h1>혜택</h1><p>부산에서의 생활, 혼자 다 챙기지 않아도 돼요.</p></div>${icon('benefits',33)}</div><div class="callout" style="margin-top:0">${icon('check',15)} 나에게 필요한 지원을 먼저 살펴보세요.<br><small>지금은 정책 탐색 화면 예시예요. 실제 자격 판단이나 신청은 제공하지 않습니다.</small></div><div class="chips">${['전체',...policies.map(p=>p.category)].map(c=>`<button class="chip ${benefitFilter===c?'selected':''}" data-action="benefitCategory:${c}" aria-pressed="${benefitFilter===c}">${c}</button>`).join('')}</div><p class="count">생활을 돕는 혜택 ${list.length}개 · 예시 데이터</p><div class="benefit-grid">${list.map(policyCard).join('')}</div>`;}
const row=(label,action,value='',ico='arrow')=>`<button class="list-item" data-action="${action}"><span>${label}</span><span class="value">${value}${icon(ico,17)}</span></button>`;
function my(){const p=state.profile;return `<div class="heading"><div><p class="eyebrow">MY HAROOT</p><h1>나의 하루트</h1><p>나의 관심과 기록을 한곳에.</p></div></div><div class="profile-card">${avatar(p||{avatar:0})}<div><h2>${esc(p?.nickname||'둘러보는 중이에요')}</h2><p class="muted">${p?esc(p.district)+' · '+esc(p.age):'가입하면 관심 정보를 저장할 수 있어요'}</p>${p?'<span class="badge">✓ 체험용 인증 완료</span>':''}</div>${button(p?'프로필 수정':'가입하기',p?'editProfile':'signup','outline')}</div>${p?.bio?`<p class="note">${esc(p.bio)}</p>`:''}<div class="tag-row">${p?.interests.map(i=>`<span class="soft-tag">${esc(i)}</span>`).join('')||''}</div><div class="list-group">${row('나의 정원','nav:garden','식물 '+state.plants.length)}${row('진행 중인 생활습관','activeHabits',String(state.habits.filter(h=>h.status==='active').length))}${row('완료한 생활습관','empty:완료한 생활습관','0')}${row('저장한 정책','savedPolicies',String(state.savedPolicies.length))}${row('저장한 활동','savedActivities',String(state.savedActivities.length))}</div><div class="list-group">${['신청한 모임','예정 활동','지난 활동','내가 만든 모임','작성한 후기','신고내역','차단 사용자'].map(t=>row(t,'empty:'+t,'0')).join('')}</div><div class="list-group">${row('알림설정','notificationsSettings')}${row('공개범위','privacy')}${row('개인정보','dataInfo')}${row(p?'로그아웃':'처음 화면으로','logout')}</div><p class="note">프로필과 저장 목록은 이 브라우저에만 저장됩니다. 실제 본인인증이나 서버 전송은 이루어지지 않아요.</p>`;}
function render(){
 if(!(state.profile||state.guest)){renderAuth();return;}
 let body;
 if(route.startsWith('garden/')&&!state.profile){body='<section class="garden-flow"><h1>나의 정원을 시작해볼까요?</h1><p class="flow-lead">프로필을 만든 뒤 루틴과 씨앗을 저장할 수 있어요.</p>'+button('가입하기','signup')+'</section>';}
 else if(route==='garden/start')body=gardenStart();
 else if(route==='garden/recommend')body=recommendStart();
 else if(route==='garden/recommend/check')body=recommendPending();
 else if(route==='garden/create-habit'){if(!habitToken)habitToken=uniqueId('creation');body=habitForm(habitDraft,habitErrors);}
 else if(route.startsWith('garden/seed-received/'))body=seedReceived(state,route.split('/')[2]);
 else if(route.startsWith('garden/plant/'))body=plantDetail(state,route.split('/')[2]);
 else body=({home,garden,discover,benefits,my}[route]||home)();
 app.innerHTML=shell(body);document.querySelector('#main h1')?.setAttribute('tabindex','-1');
}
function submitHabit(){
 if(route!=='garden/create-habit'||habitSaving)return;
 if(!requireMember())return;
 syncHabitDraft();habitErrors=validateHabit(habitDraft);
 if(Object.keys(habitErrors).length){render();document.querySelector(habitErrors.name?'#habit-name':habitErrors.category?'input[name="category"]':habitErrors.days?'input[name="days"]':'#habit-time')?.focus();return;}
 habitSaving=true;const submit=document.querySelector('#habit-submit');if(submit){submit.disabled=true;submit.textContent='씨앗을 준비하고 있어요…';}
 try{const result=saveHabitWithSeed(state,habitDraft,habitToken);state=result.state;habitErrors={};habitDraft=emptyHabitInput();habitToken='';navigate('garden/seed-received/'+result.plant.id,true);}
 catch(error){habitErrors={save:error instanceof Error?error.message:'저장하지 못했어요. 잠시 후 다시 시도해주세요.'};render();document.querySelector('#habit-save-error')?.scrollIntoView({block:'center'});}
 finally{habitSaving=false;}
}
function renderAuth(){const steps=[['하루의 생활을 가꾸다','원할 때 생활습관을 만들고<br>나만의 정원을 가꿔보세요.','garden'],['부산에서 필요한 것을 발견하다','나에게 맞는 청년정책과<br>지역활동을 만나보세요.','discover'],['사람과 지역에 연결되다','함께 활동하고 그 경험을<br>나의 정원에 기록해보세요.','people']];let content='';if(authStep==='intro'){const s=steps[introStep];content=`<div class="steps">${steps.map((_,i)=>`<span class="step-dot ${i===introStep?'active':''}"></span>`).join('')}</div><p class="eyebrow" style="margin-bottom:12px">${String(introStep+1).padStart(2,'0')} / 03</p><h1>${s[0]}</h1><p>${s[1]}</p><div class="onboarding-mini">${icon(s[2],29)}<div><strong>${['나의 속도로, 작은 시작','혼자 사는 부산생활의 발견','관심사로 시작되는 연결'][introStep]}</strong><div class="muted" style="font-size:12px;margin-top:3px">${['정원은 내가 원할 때 시작해요.','생활에 필요한 정보를 한곳에서.','처음이어도 편안하게 함께해요.'][introStep]}</div></div></div>${button(introStep<2?`다음 ${icon('arrow',16)}`:'하루트 시작하기',introStep<2?'nextIntro':'start','primary wide')}${introStep<2?button('하루트 시작하기','start','secondary wide'):''}<button class="text-btn" data-action="guest" style="display:flex;margin:12px auto">먼저 둘러보기 ${icon('arrow',14)}</button>`;}else if(authStep==='verify'){content=`<button class="back-link" data-action="backIntro">${icon('back',16)} 돌아가기</button><p class="eyebrow" style="margin-bottom:12px">A SAFE START</p><h1>안전한 하루트를 위한<br>첫 번째 인사.</h1><p>회원 기능을 이용하려면 본인인증이 필요해요.<br>실명과 전화번호는 다른 사용자에게 공개되지 않아요.</p><div class="verify-box">${icon(verified?'check':'my',36)}<strong>${verified?'본인인증 체험 완료':'PASS 본인인증 체험'}</strong><p style="font-size:12px;margin-top:8px">실제 PASS에 연결되지 않는 시연 화면입니다.<br>실명이나 전화번호를 입력하지 않아요.</p></div>${button(verified?'프로필 만들기':'PASS로 본인인증 · 체험',verified?'profile':'verify','primary wide')}`;}else content=profileForm();app.innerHTML=`<main class="intro ${authStep==='profile'?'profile':''}"><section class="intro-visual">${brand()}<div><h1>하루의 생활을 가꾸고,<br>부산과 연결되는 곳.</h1><div class="intro-art">${art(introStep===1?'camera':'garden')}</div></div><p>하루 + ROOT · 하루 + ROUTE</p></section><section class="intro-form"><div class="form-inner">${storageMessage?`<div class="storage-warning" role="alert">${esc(storageMessage)}<button class="text-btn" data-action="retryStorage">다시 불러오기</button><button class="text-btn" data-action="resetConfirm">체험 데이터 초기화</button></div>`:''}${content}<div class="intro-footer">HAROOT · 부산 청년 1인가구 통합 라이프 앱</div></div></section></main>`;}
function profileForm(){return `<button class="back-link" data-action="${editing?'cancelEdit':'backVerify'}">${icon('back',16)} 돌아가기</button><p class="eyebrow">YOUR OWN WAY</p><h1 style="margin-top:9px">${editing?'나를 소개하는 방식':'반가워요, 어떤 분인가요?'}</h1><p>얼굴 사진 없이도 좋아요.<br>나를 닮은 관심사부터 알려주세요.</p><form id="profile-form"><label class="field">프로필 이미지</label><div class="avatar-options">${avatars.map((a,i)=>`<button type="button" class="avatar-option ${draft.avatar===i&&!draft.image?'selected':''}" data-action="avatar:${i}" aria-label="기본 일러스트 ${i+1}" aria-pressed="${draft.avatar===i&&!draft.image}">${a}</button>`).join('')}${draft.image?`<img class="avatar" style="width:48px;height:48px" src="${esc(draft.image)}" alt="선택한 프로필 사진">`:''}<label class="text-btn" style="cursor:pointer">사진 업로드<input class="sr-only" type="file" id="profile-image" accept="image/png,image/jpeg,image/webp"></label></div><small>사진은 선택사항이에요. 최대 3MB.</small><label class="field">닉네임 *<input name="nickname" required minlength="2" maxlength="12" placeholder="2~12자로 입력해주세요" value="${esc(draft.nickname)}" autocomplete="nickname"></label><div class="field-row"><label class="field">연령대<select name="age">${['10대','20대','30대','40대 이상'].map(v=>`<option ${draft.age===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">성별<select name="gender">${['공개하지 않음','여성','남성','기타'].map(v=>`<option ${draft.gender===v?'selected':''}>${v}</option>`).join('')}</select></label></div><label class="field">주요 활동지역<select name="district">${districts.map(v=>`<option ${draft.district===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">관심사 <small>여러 개 선택할 수 있어요</small></label><div class="form-chips">${interests.map(i=>`<button type="button" class="chip ${draft.interests.includes(i)?'selected':''}" data-action="interest:${i}" aria-pressed="${draft.interests.includes(i)}">${i}</button>`).join('')}</div><label class="field">한 줄 소개 <small>선택</small><input name="bio" maxlength="60" placeholder="요즘 좋아하는 것, 함께하고 싶은 일" value="${esc(draft.bio)}"></label><label class="field">활동 성향<select name="style">${['조용히 활동하고 싶어요','가볍게 대화하고 싶어요','활발하게 어울리고 싶어요'].map(v=>`<option ${draft.style===v?'selected':''}>${v}</option>`).join('')}</select></label><p id="form-error" class="error" role="alert"></p><button type="submit" class="btn primary wide">${editing?'변경 내용 저장':'나의 하루트 시작하기'} ${icon('arrow',17)}</button><p class="note">프로필 설정 후 바로 홈으로 이동해요.<br>생활습관과 씨앗은 정원에서 원할 때 시작할 수 있어요.</p></form>`;}
function syncDraft(){const f=document.querySelector('#profile-form');if(f){const data=new FormData(f);for(const k of ['nickname','age','gender','district','bio','style'])draft[k]=String(data.get(k)||'');}}
function requireMember(){if(state.profile)return true;modal('나의 하루트를 시작해볼까요?',`<p>프로필을 만들면 관심 있는 활동과 혜택을 저장할 수 있어요.</p>${button('가입하기','signup','primary wide')}`);return false;}
function showActivity(id){const a=activities.find(a=>a.id===id);if(!a)return;modal(a.title,`<div class="modal-art">${art(a.art)}</div><span class="badge">${a.kind==='public'?'기관 프로그램':'사용자 모임'} · ${a.category}</span><p style="margin-top:12px">${a.description}</p><div class="detail-row">${icon('pin',17)} 부산 ${a.district}</div><div class="detail-row">${icon('clock',17)} ${a.date} · 예시 일정</div><div class="detail-row">${icon('people',17)} 정원 ${a.capacity}명 · ${a.fee}</div><div class="tag-row">${a.tags.map(t=>`<span class="soft-tag">${t}</span>`).join('')}</div><div class="callout">참여 부담도는 모임의 좋고 나쁨을 평가하는 점수가 아니에요. 나의 성향과 맞는지 살펴보는 정보예요.</div>${button(state.savedActivities.includes(id)?'저장한 활동 ✓':'관심 활동 저장하기','detailSaveActivity:'+id,'secondary wide')}<button class="btn outline wide" disabled>참가 신청 · 다음 단계에서 제공</button><p class="note">현재는 예시 활동입니다. 실제 신청·참가자 정보 공개·채팅은 이루어지지 않습니다.</p>`);}
function showPolicy(id){const p=policies.find(p=>p.id===id);if(!p)return;modal(p.name,`<span class="badge">${p.category}</span> <span class="badge orange">${p.deadline} · 예시</span><h3 style="margin:18px 0">${p.title}</h3><p>${p.description}</p><div class="callout"><strong>신청 조건 확인 예시</strong><br>△ 연령 기준 확인 필요<br>△ 거주 및 소득 기준 확인 필요<br>△ 제출서류 확인 필요</div><p>실제 공고와 연결되지 않은 화면 예시이며, 지원 자격이나 신청 가능 여부를 확정하지 않아요.</p>${button(state.savedPolicies.includes(id)?'저장한 혜택 ✓':'이 혜택 저장하기','detailSavePolicy:'+id,'secondary wide')}<button class="btn outline wide" disabled>신청하기 · 실제 공고 연동 후 제공</button>`);}
function seed(){if(!requireMember())return;habitDraft=emptyHabitInput();habitErrors={};habitToken='';navigate('garden/start');}
function savedList(kind){const isPolicy=kind==='savedPolicies';const list=(isPolicy?policies:activities).filter(a=>state[kind].includes(a.id));modal(isPolicy?'저장한 정책':'저장한 활동',list.length?`<div style="display:grid;gap:12px">${list.map(isPolicy?policyCard:activityCard).join('')}</div>`:'<div class="empty">아직 저장한 항목이 없어요.<br>마음에 드는 카드의 책갈피를 눌러보세요.</div>');}
async function action(a){const [cmd,...rest]=a.split(':');const arg=rest.join(':');if(cmd==='nav')return navigate(arg);if(cmd==='close')return close();if(cmd==='nextIntro'){introStep++;renderAuth();}if(cmd==='start'){authStep='verify';renderAuth();}if(cmd==='backIntro'){authStep='intro';renderAuth();}if(cmd==='backVerify'){syncDraft();authStep='verify';renderAuth();}if(cmd==='verify'){verified=true;renderAuth();toast('체험용 인증이 완료되었어요. 실제 본인인증은 아닙니다.');}if(cmd==='profile'){authStep='profile';renderAuth();}if(cmd==='guest'){state.guest=true;save();navigate('home');}if(cmd==='signup'){close();state.guest=false;verified=false;editing=false;authStep='verify';renderAuth();}if(cmd==='avatar'){syncDraft();draft.avatar=Number(arg);draft.image='';renderAuth();}if(cmd==='interest'){syncDraft();draft.interests=draft.interests.includes(arg)?draft.interests.filter(x=>x!==arg):[...draft.interests,arg];renderAuth();}if(cmd==='editProfile'){editing=true;draft={...state.profile,interests:[...state.profile.interests]};authStep='profile';renderAuth();window.scrollTo(0,0);}if(cmd==='cancelEdit'){editing=false;render();}if(cmd==='category'){filters.category=arg;render();}if(cmd==='clearFilters'){filters={query:'',category:'전체',district:'전체'};render();}if(cmd==='benefitCategory'){benefitFilter=arg;render();}if(cmd==='activity')showActivity(arg);if(cmd==='policy')showPolicy(arg);if(['saveActivity','savePolicy','detailSaveActivity','detailSavePolicy'].includes(cmd)){if(!requireMember())return;const isPolicy=cmd.includes('Policy');const key=isPolicy?'savedPolicies':'savedActivities';const had=state[key].includes(arg);state[key]=had?state[key].filter(x=>x!==arg):[...state[key],arg];save();render();if(cmd.startsWith('detail'))(isPolicy?showPolicy:showActivity)(arg);else if(overlay.innerHTML)savedList(key);toast(had?'저장을 해제했어요.':'나의 하루트에 저장했어요.');}if(cmd==='seed')seed();if(cmd==='cancelHabit'){habitDraft=emptyHabitInput();habitErrors={};habitToken='';navigate('garden');}
if(cmd==='retryStorage'){const restored=load();if(storageMessage){toast(storageMessage);render();}else{state=restored;render();toast('저장된 정보를 다시 불러왔어요.');}}
if(cmd==='activeHabits'){if(state.habits.length)navigate('garden');else modal('진행 중인 생활습관','<div class="empty">아직 시작한 생활습관이 없어요.</div>'+button('정원에서 시작하기','nav:garden','primary wide'));}
if(cmd==='createMeeting')modal('나만의 모임 만들기',`<p>좋아하는 활동으로 부산의 이웃과 만나요.</p><div class="callout">모임명 · 활동 설명 · 날짜와 시간 · 지역<br>만남장소 · 참가인원 · 참가비 · 준비물<br>초보자 참여 여부 · 대화량 · 활동 강도</div><p>모임 개설과 참가 신청은 다음 개발 단계에서 연결됩니다.</p><button class="btn outline wide" disabled>모임 개설 · 준비 중</button>`);if(cmd==='neighbors')modal('이웃의 정원',`<p>다양한 부산생활을 만나보세요. 아래는 가상 사용자입니다.</p><div class="list-group">${users.map(u=>row(`${avatars[u.avatar]} ${u.nickname}`,'neighbor:'+u.id,u.district)).join('')}</div>`);if(cmd==='neighbor'){const u=users.find(u=>u.id===arg);modal(esc(u.nickname)+'의 정원',`<div class="modal-art">${art('garden')}</div><span class="badge">가상 사용자 · 공개 정원 예시</span><p style="margin-top:15px">${u.district} · ${u.age}<br>관심사: ${u.interests.join(', ')}</p><div class="callout">이 화면에는 공개된 정보만 표시돼요. 비공개 생활습관 인증사진은 표시되지 않습니다.</div><button class="btn outline wide" disabled>응원 보내기 · 다음 단계에서 제공</button>`);}if(cmd==='messages')modal('모임 메시지',`<div class="empty">${icon('message',35)}<h3 style="margin:15px 0 7px">아직 참여 중인 채팅이 없어요</h3>참가가 확정된 모임에서 대화를 시작할 수 있어요.</div><p class="note">모임 신청과 그룹채팅은 다음 단계에서 구현됩니다.</p>`);if(cmd==='notifications')modal('알림',`<div class="callout"><strong>하루트에 오신 걸 환영해요.</strong><br>부산의 활동과 혜택부터 천천히 둘러보세요.</div><p>시제품 안내 알림입니다. 실제 푸시 알림은 전송되지 않아요.</p>`);if(cmd==='savedActivities'||cmd==='savedPolicies')savedList(cmd);if(cmd==='empty')modal(esc(arg),`<div class="empty">아직 ${esc(arg)} 기록이 없어요.</div><p class="note">관련 세부 기능은 이후 단계에서 연결될 예정입니다.</p>`);if(cmd==='notificationsSettings')modal('알림설정',`<p>알림 수신 선호를 저장해요. 실제 푸시는 아직 전송되지 않습니다.</p><button class="list-item" data-action="toggleNotifications"><span>활동 및 혜택 알림</span><span class="switch ${state.notifications?'on':''}" aria-label="${state.notifications?'켜짐':'꺼짐'}"></span></button>`);if(cmd==='toggleNotifications'){state.notifications=!state.notifications;save();action('notificationsSettings');}if(cmd==='privacy')modal('공개범위',`<p>생활습관 인증사진은 기본적으로 비공개예요.</p><div class="callout">인증사진 기본값: 비공개<br>프로필: 닉네임·관심사 중심<br>실명·전화번호: 다른 사용자에게 비공개</div><p>사진 인증 및 개별 공개 설정은 다음 단계에서 구현됩니다.</p>`);if(cmd==='dataInfo')modal('개인정보와 시제품 데이터',`<p>프로필·관심사·저장 목록은 현재 브라우저의 Local Storage에 저장됩니다. 다른 기기와 동기화되지 않아요.</p><div class="callout">실제 PASS 인증·정책 API·채팅 서버는 연결되어 있지 않습니다. 실제 실명이나 전화번호는 수집하지 않습니다.</div>${button('이 브라우저의 체험 데이터 삭제','resetConfirm','outline wide')}`);if(cmd==='logout')modal('처음 화면으로 돌아갈까요?',`<p>프로필과 저장 목록은 이 브라우저에 유지됩니다. 실제 계정 로그아웃은 아닌 시제품 화면 전환이에요.</p>${button('돌아가기','confirmLogout','primary wide')}`);if(cmd==='confirmLogout'){close();authStep='intro';introStep=0;renderAuth();}if(cmd==='resetConfirm')modal('체험 데이터를 삭제할까요?',`<p>이 브라우저에 저장한 프로필, 사진, 저장 목록이 삭제됩니다.</p>${button('체험 데이터 삭제','confirmReset','primary wide')}`);if(cmd==='confirmReset'){if(!resetStorage()){toast(storageMessage);return;}habitDraft=emptyHabitInput();habitErrors={};habitToken='';state={profile:null,guest:false,savedActivities:[],savedPolicies:[],habits:[],plants:[],objects:[],notifications:true,privatePhotos:true};draft={nickname:'',avatar:0,image:'',age:'20대',gender:'공개하지 않음',district:'부산진구',interests:[],bio:'',style:'조용히 활동하고 싶어요'};verified=false;editing=false;save();close();authStep='intro';introStep=0;render();}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b){e.preventDefault();action(b.dataset.action);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-action]')){e.preventDefault();action(e.target.dataset.action);}if(e.key==='Tab'&&overlay.innerHTML){const focus=[...overlay.querySelectorAll('button:not([disabled]),input,select,textarea,[tabindex="0"]')];const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
document.addEventListener('input',e=>{if(e.target.id==='activity-search'){filters.query=e.target.value;document.querySelector('#activity-results').innerHTML=activityResults();}});
document.addEventListener('change',async e=>{if(e.target.id==='habit-notification'){syncHabitDraft();const field=document.querySelector('#intensity-field');field.hidden=!e.target.checked;field.disabled=!e.target.checked;}if(e.target.id==='district-filter'){filters.district=e.target.value;document.querySelector('#activity-results').innerHTML=activityResults();}if(e.target.id==='profile-image'){syncDraft();const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){toast('3MB 이하의 JPG, PNG, WEBP 사진을 선택해주세요.');return;}try{const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=canvas.height=180;const ctx=canvas.getContext('2d');const edge=Math.min(img.width,img.height);ctx.drawImage(img,(img.width-edge)/2,(img.height-edge)/2,edge,edge,0,0,180,180);draft.image=canvas.toDataURL('image/jpeg',.8);renderAuth();}catch{toast('이 사진을 읽지 못했어요. 다른 사진을 선택해주세요.');}}});
document.addEventListener('submit',e=>{if(e.target.id==='habit-form'){e.preventDefault();submitHabit();return;}if(e.target.id!=='profile-form')return;e.preventDefault();syncDraft();draft.nickname=draft.nickname.trim();if(draft.nickname.length<2){document.querySelector('#form-error').textContent='닉네임은 공백을 제외하고 2자 이상 입력해주세요.';return;}const nextState={...state,profile:{...draft,interests:[...draft.interests]},guest:false};if(!persist(nextState)){document.querySelector('#form-error').textContent=storageMessage;return;}state=nextState;const wasEditing=editing;editing=false;navigate(wasEditing?'my':'home');toast(wasEditing?'프로필을 저장했어요.':'반가워요! 나의 속도로 부산생활을 시작해요.');});
function restoreRoute(){const next=location.hash.slice(1);if(!isRoute(next))return;if(route==='garden/create-habit')syncHabitDraft();if(next==='garden'||!next.startsWith('garden/')){habitDraft=emptyHabitInput();habitErrors={};habitToken='';}route=next;if(state.profile||state.guest)render();}
window.addEventListener('hashchange',restoreRoute);
window.addEventListener('popstate',restoreRoute);
if(isRoute(location.hash.slice(1)))route=location.hash.slice(1);
render();
if(storageMessage)toast(storageMessage);

</script></body></html>
